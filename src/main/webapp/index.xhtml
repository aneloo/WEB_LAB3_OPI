<!DOCTYPE html>
<html lang="ru"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="jakarta.faces.core">

<f:loadBundle basename="messages" var="msg"/>

<h:head>
    <title>#{msg['page.title']}</title>

    <meta name="author" content="Volnova Anna"/>
    <meta name="description" content="Third lab work for web-programming"/>

    <h:outputStylesheet library="styles" name="style_index.css"/>
    <h:outputScript library="scripts" name="clock.js"/>
</h:head>

<h:body>

    <nav>
        <div class="logo">Вольнова Анна P3219. Вариант 5467</div>
    </nav>

    <div class="clockpage">
        <div id="clock"></div>
        <div id="dayOfWeek"></div>
    </div>

    <section class="hero">
        <div class="hero-container">
            <div class="column-left">
                <h1>#{msg['hero.title']}</h1>

                <h:button styleClass="start_button"
                          outcome="toMain"
                          value="#{msg['button.check']}"/>
            </div>
        </div>
    </section>

</h:body>
</html>
